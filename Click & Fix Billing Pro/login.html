<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | Click &amp; Fix Billing Pro</title>
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main id="main" class="login-page min-vh-100 d-flex align-items-center justify-content-center py-4">
    <section class="login-card container-fluid p-0" aria-label="Administrator login">
      <div class="row g-0 h-100">
        <div class="col-lg-6 d-flex">
          <div class="form-section w-100">
            <div class="login-form-wrap">
              <div class="text-center mb-4">
                <h1 class="h3 mb-2">Admin Login</h1>
                <p class="text-muted mb-0">Sign in to securely manage your billing workspace.</p>
              </div>
              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="email">Email Address</label>
                  <input type="email" class="form-control" id="email" placeholder="Enter your email" autocomplete="username">
                </div>
                <div class="mb-3">
                  <label class="form-label" for="password">Password</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="current-password">
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password"><i class="bi bi-eye"></i></button>
                  </div>
                </div>
                <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
                  <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">Remember Me</label>
                  </div>
                  <a class="forgot-link" href="#">Forgot Password?</a>
                </div>
                <div class="alert alert-danger d-none" id="loginError" role="alert">Invalid Email or Password.</div>
                <button class="btn btn-primary w-100" id="loginBtn" type="submit">Login</button>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-6 d-flex">
          <aside class="overlay-section w-100" aria-label="Click and Fix Billing Pro">
            <div class="overlay-content">
              <span class="brand-mark"><i class="bi bi-receipt-cutoff"></i></span>
              <h2>Click &amp; Fix<br>Billing Pro</h2>
              <p>Secure Billing Management System</p>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
