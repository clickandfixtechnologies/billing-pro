<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17324d">
    <title>Click &amp; Fix Billing Pro</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/invoice.css?v=13">
    <style>html:not(.authenticated) body{visibility:hidden}</style>
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="brand">
          <span class="brand-mark">CF</span>
          <span><strong>Click &amp; Fix</strong><small>Billing Pro</small></span>
        </div>
        <nav id="mainNav" class="nav-list">
          <a href="#dashboard" data-route="dashboard" class="nav-link active">Dashboard</a>
          <a href="#customers" data-route="customers" class="nav-link">Customers</a>
          <a href="#products" data-route="products" class="nav-link">Products</a>
          <a href="#inventory" data-route="inventory" class="nav-link">Inventory</a>
          <a href="#purchases" data-route="purchases" class="nav-link">Purchases &amp; Suppliers</a>
          <a href="#invoices" data-route="invoices" class="nav-link">Invoices</a>
          <a href="#payments" data-route="payments" class="nav-link">Payments</a>
          <a href="#reports" data-route="reports" class="nav-link">Reports</a>
          <a href="#dues" data-route="dues" class="nav-link">Due List &amp; Reminders</a>
          <a href="#emailTemplates" data-route="emailTemplates" class="nav-link">Email Templates</a>
          <a href="#campaigns" data-route="campaigns" class="nav-link">Bulk Email Campaigns</a>
          <a href="#backup" data-route="backup" class="nav-link">Backup &amp; Restore</a>
          <a href="#settings" data-route="settings" class="nav-link">Settings</a>
        </nav>
        <div class="sidebar-footer">v1.00.0<br>Click & Fix Billing Pro</div>
      </aside>
      <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

      <main class="main-panel">
        <header class="topbar">
          <button id="menuButton" class="menu-button" aria-label="Open navigation" aria-expanded="false">☰</button>
          <div>
            <h1 id="pageTitle">Dashboard</h1>
            <p id="todayDate" class="muted"></p>
          </div>
          <div class="topbar-actions">
            <button id="syncButton" class="status-button" title="Open Google Drive Backup settings">
              <span class="status-dot offline"></span><span id="syncLabel">Local only</span>
            </button>
            <button id="logoutBtn" class="status-button" type="button">Logout</button>
          </div>
        </header>
        <section id="view" class="view" aria-live="polite"></section>
      </main>
    </div>
    <div id="toastHost" class="toast-host" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/database.js?v=7"></script>
    <script src="js/customers.js?v=2"></script>
    <script src="js/products.js?v=4"></script>
    <script src="js/inventory.js"></script>
    <script src="js/purchases.js?v=4"></script>
    <script src="js/invoices.js?v=7"></script>
    <script src="js/payments.js?v=6"></script>
    <script src="js/reports.js?v=17"></script>
    <script src="js/reminders.js?v=17"></script>
    <script src="js/emailTemplates.js?v=21"></script>
    <script src="js/campaigns.js?v=2"></script>
    <script src="js/backup.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/settings.js?v=5"></script>
    <script src="js/pdf.js?v=8"></script>
    <script src="js/router.js?v=2"></script>
    <script src="js/app.js?v=4"></script>
    <script type="module" src="js/auth.js?v=2"></script>
  </body>
</html>
